{{ define "main" }}
<section class="error-page" data-pagefind-ignore>
  <p class="error-page__code">404</p>
  <h1 class="error-page__title">Page Not Found</h1>
  <p class="error-page__lede">
    The page you're looking for isn't here — it may have moved, been
    renamed, or never existed.
  </p>
  <link href="{{ "/pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
  <div id="search" class="error-page__search"></div>
  <script src="{{ "/pagefind/pagefind-ui.js" | relURL }}"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      if (window.PagefindUI) {
        new PagefindUI({ element: "#search", showSubResults: true, showImages: false });
      }
    });
  </script>
</section>
{{ end }}
