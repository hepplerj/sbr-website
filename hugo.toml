baseURL = "https://governingground.org/"
languageCode = "en-us"
title = "Governing Ground"
theme = "sagebrush"
enableGitInfo = false
enableEmoji = false

[params]
  version = "1.0.5"   # bump on release; rendered in the footer license bar
  subtitle = "A century of sagebrush rebellions"
  description = "A history of recurring fights over land, power, and federal authority in the American West from the 1930s to the 2020s."
  author = "Jason A. Heppler"
  heroImage = "images/hero_usda.jpg"
  heroCredit = "Fort Keogh Livestock and Range Research Station, Montana | US Department of Agriculture"
  heroCreditURL = "https://www.flickr.com/photos/usdagov/8432666225"
  citationStyle = "chicago"

[params.social]
  github = "hepplerj/sbr-website"

[menu]
  [[menu.main]]
    name = "Sightlines"
    url = "/sightlines/"
    weight = 10
  [[menu.main]]
    name = "Atlas"
    url = "/atlas/"
    weight = 15
  [[menu.main]]
    name = "Data"
    url = "/data/"
    weight = 20
  [[menu.main]]
    name = "Bibliography"
    url = "/sources/"
    weight = 30
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 50
  [[menu.main]]
    name = "Writing"
    url = "/narrative/"
    weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      footnote = true
      [markup.goldmark.extensions.typographer]
        disable = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[outputs]
  # RSS is opted into per-section via `outputs:` frontmatter on the
  # section's _index.md. Currently: /narrative/ (the main site feed)
  # and /updates/ (the changelog feed). Other sections emit HTML only.
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  tag = "tags"
  theme = "themes"
  place = "places"

# Related-content scoring for the narrative singles' "Related" section.
# Hugo ranks every other page against the current one using these
# indices and returns the highest-scoring matches via
# `.Site.RegularPages.Related .`. Themes (the project's primary
# thematic taxonomy) weighted highest; tags and places fill in; recency
# breaks ties via the `date` index. Lower threshold = more permissive.
[related]
  threshold = 60
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "themes"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "places"
    weight = 40
  [[related.indices]]
    name = "date"
    weight = 10

[build]
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "(js|scripts|javascript)"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(css|scss|sass)"
    target = "(css|styles|scss|sass)"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"
